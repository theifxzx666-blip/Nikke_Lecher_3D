<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>莱彻 3D 查看器 · 47/48 章关底 BOSS</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --line:#2a323d; --fg:#e6edf3;
    --dim:#8b98a5; --acc:#4f9cf9; --acc2:#e0533d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font:13px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  #app{position:fixed;inset:0}
  canvas{display:block}

  #hud{position:fixed;left:0;top:0;bottom:0;width:250px;background:var(--panel);
    border-right:1px solid var(--line);padding:14px;overflow-y:auto;z-index:10}
  #hud h1{font-size:14px;margin:0 0 2px;font-weight:600;letter-spacing:.3px}
  #hud .sub{font-size:11px;color:var(--dim);margin-bottom:14px}
  .grp{margin-bottom:16px}
  .grp>label{display:block;font-size:11px;color:var(--dim);margin-bottom:6px;
    text-transform:uppercase;letter-spacing:.6px}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .seg.one{grid-template-columns:1fr}
  button{background:#1f2630;color:var(--fg);border:1px solid var(--line);border-radius:6px;
    padding:7px 8px;font-size:12px;cursor:pointer;font-family:inherit;transition:.12s}
  button:hover{background:#26303c;border-color:#3a4553}
  button.on{background:var(--acc);border-color:var(--acc);color:#04101f;font-weight:600}
  button:disabled{opacity:.4;cursor:not-allowed}
  .row{display:flex;align-items:center;gap:8px;margin-top:8px}
  input[type=range]{flex:1;accent-color:var(--acc)}
  .val{font-variant-numeric:tabular-nums;color:var(--dim);min-width:38px;text-align:right}
  #parts{max-height:190px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;padding:6px}
  #parts label{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:11px;cursor:pointer}
  #parts input{accent-color:var(--acc)}
  .meta{font-size:11px;color:var(--dim);line-height:1.7;border-top:1px solid var(--line);
    padding-top:10px;margin-top:4px}
  .meta b{color:var(--fg);font-weight:500}

  #status{position:fixed;left:266px;bottom:14px;font-size:11px;color:var(--dim);
    background:rgba(14,17,22,.85);padding:6px 10px;border-radius:6px;
    border:1px solid var(--line);z-index:10;white-space:pre}
  #spin{position:fixed;inset:0;display:none;place-items:center;background:rgba(14,17,22,.7);
    z-index:20;font-size:13px;color:var(--dim)}
  #spin.on{display:grid}
  html.noui #hud, html.noui #status{display:none}

  /* ---- GIF 导出面板 ---- */
  #gifModal{position:fixed;inset:0;display:none;place-items:center;
    background:rgba(6,9,13,.72);backdrop-filter:blur(2px);z-index:30}
  #gifModal.on{display:grid}
  #gifModal .card{width:330px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:16px 16px 14px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
  #gifModal h2{font-size:13px;margin:0 0 3px;font-weight:600}
  #gifModal .cap{font-size:11px;color:var(--dim);margin-bottom:14px}
  .frow{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .frow>span{font-size:11px;color:var(--dim);width:40px;flex:none}
  .frow .seg{flex:1;grid-template-columns:repeat(3,1fr)}
  .frow .seg.two{grid-template-columns:1fr 1fr}
  .frow .seg button{padding:5px 4px;font-size:11px}
  #gifModal .seg{display:grid;gap:5px}
  .bar{height:5px;border-radius:3px;background:#0d1218;overflow:hidden;margin:12px 0 7px;
    border:1px solid var(--line)}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#7ec2ff);
    transition:width .12s linear}
  .hint{font-size:11px;color:var(--dim);line-height:1.6;min-height:17px;
    font-variant-numeric:tabular-nums}
  .hint b{color:var(--fg);font-weight:500}
  #gifGo.busy{opacity:.55;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <h1>莱彻 3D 查看器</h1>
  <div class="sub">47 / 48 章关底 BOSS · 带骨骼动画</div>

  <div class="grp">
    <label>BOSS</label>
    <div class="seg" id="bossSeg">
      <button data-boss="xba003" class="on">安尼希利奥</button>
      <button data-boss="eba002">莉贝雷利奥</button>
    </div>
  </div>

  <div class="grp">
    <label>阶段</label>
    <div class="seg" id="phaseSeg">
      <button data-phase="1phase" class="on">1 阶段</button>
      <button data-phase="2phase" class="on">2 阶段</button>
    </div>
  </div>

  <div class="grp">
    <label>动画</label>
    <button id="play" style="width:100%">▶ 播放关卡内 idle</button>
    <div class="row"><span style="color:var(--dim);font-size:11px">速度</span>
      <input id="speed" type="range" min="0" max="200" value="100">
      <span class="val" id="speedV">1.0×</span></div>
  </div>

  <div class="grp">
    <label>显示</label>
    <div class="seg">
      <button id="autorot">自动旋转</button>
      <button id="wire">线框</button>
    </div>
    <div class="seg" style="margin-top:6px">
      <button id="theme">深色底</button>
      <button id="shot">截图</button>
    </div>
  </div>

  <div class="grp">
    <label>部件（可单独隐藏）</label>
    <div id="parts"></div>
  </div>

  <div class="grp">
    <label>导出</label>
    <button id="gifBtn" style="width:100%">导出 GIF 动图</button>
  </div>

  <div class="meta" id="meta"></div>
</div>

<div id="gifModal">
  <div class="card">
    <h2>导出 GIF</h2>
    <div class="cap" id="gifCap">当前：安尼希利奥 · 1 阶段</div>

    <div class="frow"><span>长边</span>
      <div class="seg" id="gifSize">
        <button data-v="640">640</button>
        <button data-v="900" class="on">900</button>
        <button data-v="1200">1200</button>
      </div>
    </div>
    <div class="frow"><span>帧率</span>
      <div class="seg" id="gifFps">
        <button data-v="12">12</button>
        <button data-v="15" class="on">15</button>
        <button data-v="20">20</button>
      </div>
    </div>
    <div class="frow"><span>底色</span>
      <div class="seg two" id="gifBg">
        <button data-v="dark" class="on">深色</button>
        <button data-v="light">浅色</button>
      </div>
    </div>

    <div class="bar"><i id="gifBar"></i></div>
    <div class="hint" id="gifMsg">准备就绪</div>

    <div class="seg two" style="margin-top:12px">
      <button id="gifGo" class="on">开始导出</button>
      <button id="gifClose">关闭</button>
    </div>
  </div>
</div>

<div id="status">拖动旋转 · 滚轮缩放 · 右键平移</div>
<div id="spin">加载中…</div>

<script>
// 把脚本错误直接显示在状态栏，避免"页面空白但不知道错在哪"
window.addEventListener('error', e=>{
  const s=document.getElementById('status');
  if(s) s.textContent = '脚本错误：' + (e.message || e.error) + '\n' + (e.filename||'');
});
window.addEventListener('unhandledrejection', e=>{
  const s=document.getElementById('status');
  if(s) s.textContent = 'Promise 拒绝：' + (e.reason && e.reason.message || e.reason);
});
</script>
<!-- 按整段动画的包络算好的取景框（build_anim_framing.py 生成）。
     没有它也能看，只是登场/战败这类大位移动画后半段会跑出画面。 -->
<script src="framing.js"></script>
<script type="importmap">
{"imports":{"three":"./vendor/three.module.js"}}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/GLTFLoader.js';
import { OrbitControls } from './vendor/OrbitControls.js';
import { exportGif, planFrames } from './gif-export.js';

const MODELS = {
  xba003: { name:'安尼希利奥', 1:'./models/xba003_1phase.glb', 2:'./models/xba003_2phase.glb' },
  eba002: { name:'莉贝雷利奥躯体', 1:'./models/eba002_1phase.glb', 2:'./models/eba002_2phase.glb' },
};

const state = { boss:'xba003', phase:1, playing:false, speed:1, autorot:false, wire:false, dark:true, suspend:false,
                glb:null, title:null };

// URL 参数：?boss=eba002&phase=2&play=1&t=1.2&rot=1&bg=light&wire=1
// 任意 glb：?glb=xba003_2phase_death.glb&title=安尼希利奥_2阶段_战败
//   表演动画（登场 / groggy / 战败）与 idle 的网格相同、只有 AnimationClip 不同，
//   一条动画一个 glb，所以不能再按 boss+phase 取文件，得能直接点名。
(function(){
  const q = new URLSearchParams(location.search);
  if(MODELS[q.get('boss')]) state.boss = q.get('boss');
  if(q.get('phase') === '2') state.phase = 2;
  if(q.get('glb'))   state.glb   = q.get('glb');
  if(q.get('title')) state.title = q.get('title');
  state.playing = q.get('play') === '1';
  state.autorot = q.get('rot') === '1';
  state.wire    = q.get('wire') === '1';
  state.dark    = q.get('bg') !== 'light';
  state.seek    = q.has('t') ? parseFloat(q.get('t')) : null;
  // ui=0：隐藏左侧面板与状态栏，只留模型，方便截图
  if(q.get('ui') === '0'){
    document.documentElement.classList.add('noui');
  }
})();

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.1, 5000);
camera.position.set(0, 0, 120);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.rotateSpeed = 0.9;

scene.add(new THREE.AmbientLight(0xffffff, 2.2));
const d1 = new THREE.DirectionalLight(0xffffff, 1.6); d1.position.set(1, 2, 3); scene.add(d1);
const d2 = new THREE.DirectionalLight(0x88aaff, 0.7); d2.position.set(-2, -1, -2); scene.add(d2);

const loader = new GLTFLoader();
let root = null, mixer = null, action = null, clipLen = 0, box = null, homePos = null, homeTarget = null;

function setStatus(t){ document.getElementById('status').textContent = t; }

function fit(obj, key){
  box = new THREE.Box3().setFromObject(obj);
  // 动画模型：用 framing.js 里算好的框，而不是加载那一刻（= 绑定姿态）的包围盒。
  //
  // 这里用 bind（模型本体），**不用** union（整段动画的并集）。
  // 踩过的坑：战败动画会把环状部件炸飞到 z≈-148、升到 y≈78，
  // 并集框的中心整个被拖走 —— 相机跟着盯到一百多米外，
  // 而第 0 帧的模型还在原点，结果主体只占画面一小块还偏在一角。
  // 交互查看就该像游戏里一样：镜头对着角色本体，动画自己飞出去是演出的一部分。
  // union 只用来兜住 far，免得飞远的碎屑被裁掉。
  const fr = window.__FRAMING && window.__FRAMING[key];
  let farR = 0;
  if(fr && fr.union && fr.union.size){
    farR = Math.max(fr.union.size[0], fr.union.size[1], fr.union.size[2]);
  }
  if(fr && fr.bind && fr.bind.center){
    // bind.size 是绑定姿态的真实包围盒三边（不是稳健分位数），刚好把模型完整包住。
    // 中心取「第 0 帧」的：登场动画首帧模型在天上（安尼希利奥 y≈136），
    // 而绑定姿态在地面（y≈15）—— 用 bind 的中心会看到一片空画面。
    // 用首帧中心 + 本体尺寸，进页面就能看清角色，之后它自己飞走/落下属于演出。
    const sz = fr.bind.size
      ? new THREE.Vector3().fromArray(fr.bind.size)
      : new THREE.Vector3().setScalar(Math.max((fr.bind.radius || 1) * 2, 1));
    const c = (fr.track && fr.track[0])
      ? new THREE.Vector3(fr.track[0][0], fr.track[0][1], fr.track[0][2])
      : new THREE.Vector3().fromArray(fr.bind.center);
    box.setFromCenterAndSize(c, sz);
  }
  const c = box.getCenter(new THREE.Vector3());
  const s = box.getSize(new THREE.Vector3());
  const r = Math.max(s.x, s.y, s.z);
  const dist = r / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov/2))) * 1.35;
  homeTarget = c.clone();
  homePos = new THREE.Vector3(c.x, c.y, c.z + dist);
  camera.position.copy(homePos);
  camera.near = Math.max(r/1000, 0.01);
  camera.far = Math.max(r * 50, farR * 10);
  camera.updateProjectionMatrix();
  controls.target.copy(c);
  controls.update();
  controls.saveState();
  document.getElementById('meta').innerHTML =
    `<b>尺寸</b> ${s.x.toFixed(1)} × ${s.y.toFixed(1)} × ${s.z.toFixed(1)}<br>` +
    `<b>部件</b> ${obj.userData.parts}　<b>骨骼</b> ${obj.userData.bones}<br>` +
    `<b>动画</b> ${clipLen ? clipLen.toFixed(2)+' s / '+(obj.userData.frames||'?')+' 帧' : '无'}`;
}

// 逐帧取景轨迹（framing.js 里的 track）。只有 GIF 导出会用它，
// 交互查看仍用整段并集框 —— 那样用户能自由转视角，不会被镜头拽着走。
let frameTrack = null;

function followTrack(t){
  if(!frameTrack || !frameTrack.length || !clipLen) return;
  const u = Math.max(0, Math.min(1, t / clipLen)) * (frameTrack.length - 1);
  const i = Math.min(frameTrack.length - 2, Math.floor(u));
  const k = u - i, a = frameTrack[i], b = frameTrack[i + 1];
  const c = new THREE.Vector3(
    a[0] + (b[0] - a[0]) * k,
    a[1] + (b[1] - a[1]) * k,
    a[2] + (b[2] - a[2]) * k);
  const r = a[3] + (b[3] - a[3]) * k;
  const dist = r / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) * 1.35;
  camera.position.set(c.x, c.y, c.z + dist);
  camera.near = Math.max(r / 1000, 0.01);
  camera.far = Math.max(r * 50, 1000);
  camera.updateProjectionMatrix();
  controls.target.copy(c);
  camera.lookAt(c);
}

function buildPartList(obj){
  const host = document.getElementById('parts');
  host.innerHTML = '';
  obj.traverse(o=>{
    if(!o.isMesh) return;
    const id = 'p'+host.children.length;
    const lb = document.createElement('label');
    const cb = document.createElement('input');
    cb.type='checkbox'; cb.checked=true;
    cb.onchange = ()=>{ o.visible = cb.checked; };
    lb.appendChild(cb);
    lb.appendChild(document.createTextNode(o.name || o.parent?.name || 'mesh'));
    host.appendChild(lb);
  });
}

function modelUrl(){
  return state.glb ? './models/' + state.glb : MODELS[state.boss][state.phase];
}

function load(){
  const url = modelUrl();
  const key = url.split('/').pop();
  document.getElementById('spin').classList.add('on');
  setStatus('加载 ' + url.split('/').pop());
  loader.load(url, (gltf)=>{
    if(root){ scene.remove(root); }
    root = gltf.scene;

    let nMesh=0, nBone=0;
    root.traverse(o=>{
      if(o.isBone) nBone++;
      if(o.isMesh){
        nMesh++;
        o.frustumCulled = false;
        const m = o.material;
        if(m){
          m.side = THREE.DoubleSide;
          m.alphaTest = 0.5;          // 与参考站一致：靠 alphaTest 剔除透明像素，
          m.transparent = false;       // 不用 BLEND，避免半透明互相叠出黑边
          m.depthWrite = true;
          m.roughness = 1.0; m.metalness = 0.0;
          if(!m.map) m.color = new THREE.Color(0x9aa3ad);
          m.needsUpdate = true;
        }
      }
    });
    root.userData.parts = nMesh;
    root.userData.bones = nBone;
    root.userData.frames = null;

    scene.add(root);
    const fr = window.__FRAMING && window.__FRAMING[key];
    frameTrack = (fr && fr.track && fr.track.length) ? fr.track : null;
    fit(root, key);
    buildPartList(root);

    // 动画
    if(mixer){ mixer.stopAllAction(); mixer = null; action = null; }
    if(gltf.animations && gltf.animations.length){
      mixer = new THREE.AnimationMixer(root);
      action = mixer.clipAction(gltf.animations[0]);
      action.setLoop(THREE.LoopRepeat);
      clipLen = gltf.animations[0].duration;
      const nF = gltf.animations[0].tracks.length ? Math.round(clipLen*30)+1 : 0;
      root.userData.frames = nF;
      if(state.playing) action.play();
      document.getElementById('play').disabled = false;
    } else {
      clipLen = 0;
      document.getElementById('play').disabled = true;
      state.playing = false;
      document.getElementById('play').classList.remove('on');
      document.getElementById('play').textContent = '无内置动画';
    }
    fit(root, key);   // 再算一次，让 meta 带上帧数
    syncUI();
    document.getElementById('spin').classList.remove('on');
    setStatus(`已加载 · ${nMesh} 部件 · ${nBone} 骨骼${clipLen?` · 动画 ${clipLen.toFixed(2)}s`:''}`);
    if(window.__nkas){ window.__nkas.ready = true; window.__nkas.clipLen = clipLen;
                       window.__nkas.parts = nMesh; window.__nkas.bones = nBone; }
  }, (e)=>{
    setStatus('读取中 ' + Math.round(e.loaded/Math.max(e.total,1)*100) + '%');
  }, (err)=>{
    document.getElementById('spin').classList.remove('on');
    setStatus('加载失败：' + err.message);
    console.error(err);
  });
}

// 把 UI 与 state 对齐（含 URL 参数指定的初始状态）
function syncUI(){
  document.querySelectorAll('#bossSeg button').forEach(b=>
    b.classList.toggle('on', b.dataset.boss === state.boss));
  document.querySelectorAll('#phaseSeg button').forEach(b=>
    b.classList.toggle('on', b.dataset.phase === (state.phase===1?'1phase':'2phase')));

  const pb = document.getElementById('play');
  if(action){
    pb.disabled = false;
    action.enabled = true;
    action.timeScale = state.speed;
    action.play();
    // three 的 AnimationAction._update 里 paused 会把 timeScale 归零，
    // 所以 setTime 必须在 paused=false 的状态下调用，否则时间轴根本推不动
    // （实测直接 setTime 两张截图像素差 0.0）。
    action.paused = false;
    if(state.seek != null) mixer.setTime(Math.min(state.seek, clipLen*0.999));
    else mixer.update(0);
    action.paused = !state.playing;
    pb.classList.toggle('on', state.playing);
    pb.textContent = state.playing ? '⏸ 暂停' : '▶ 播放关卡内 idle';
  }
  controls.autoRotate = state.autorot;
  document.getElementById('autorot').classList.toggle('on', state.autorot);
  if(root) root.traverse(o=>{ if(o.isMesh && o.material) o.material.wireframe = state.wire; });
  document.getElementById('wire').classList.toggle('on', state.wire);
  renderer.setClearColor(state.dark ? 0x0e1116 : 0xffffff, state.dark ? 1 : 0);
  const tb = document.getElementById('theme');
  tb.textContent = state.dark ? '深色底' : '浅色底';
  tb.classList.toggle('on', !state.dark);
}

// ---------- UI ----------
document.getElementById('bossSeg').addEventListener('click', (e)=>{
  const b = e.target.dataset.boss; if(!b) return;
  state.boss = b; state.glb = null; state.title = null;   // 手动切 boss 就退出「点名 glb」模式
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on', x.dataset.boss===b));
  load();
});
document.getElementById('phaseSeg').addEventListener('click', (e)=>{
  const p = e.target.dataset.phase; if(!p) return;
  state.phase = p==='1phase' ? 1 : 2;
  state.glb = null; state.title = null;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on', x.dataset.phase===p));
  load();
});

document.getElementById('play').onclick = (e)=>{
  if(!action) return;
  state.playing = !state.playing;
  e.currentTarget.classList.toggle('on', state.playing);
  e.currentTarget.textContent = state.playing ? '⏸ 暂停' : '▶ 播放关卡内 idle';
  state.playing ? action.play() : action.stop();
};

document.getElementById('speed').oninput = (e)=>{
  state.speed = e.target.value/100;
  document.getElementById('speedV').textContent = state.speed.toFixed(1)+'×';
  if(action) action.timeScale = state.speed;
};

document.getElementById('autorot').onclick = (e)=>{
  state.autorot = !state.autorot;
  controls.autoRotate = state.autorot;
  controls.autoRotateSpeed = 1.2;
  e.currentTarget.classList.toggle('on', state.autorot);
};

document.getElementById('wire').onclick = (e)=>{
  state.wire = !state.wire;
  e.currentTarget.classList.toggle('on', state.wire);
  if(root) root.traverse(o=>{ if(o.isMesh && o.material) o.material.wireframe = state.wire; });
};

document.getElementById('theme').onclick = (e)=>{
  state.dark = !state.dark;
  e.currentTarget.textContent = state.dark ? '深色底' : '浅色底';
  e.currentTarget.classList.toggle('on', !state.dark);
  renderer.setClearColor(state.dark ? 0x0e1116 : 0xffffff, state.dark ? 1 : 0);
};

document.getElementById('shot').onclick = ()=>{
  renderer.render(scene, camera);
  const a = document.createElement('a');
  a.href = renderer.domElement.toDataURL('image/png');
  a.download = `${state.boss}_${state.phase}phase.png`;
  a.click();
};

// 双击复位
renderer.domElement.ondblclick = ()=> controls.reset();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setClearColor(0x0e1116, 1);

// ---------- 外部逐帧接口 ----------
// 供 export_gif.py 通过 CDP 调用：把动画定格到某个时刻并立刻出图。
// 注意 action.paused 会把 timeScale 归零，所以 setTime 必须在 paused=false 时调用。
window.__nkas = {
  ready: false, clipLen: 0, parts: 0, bones: 0,
  seek(t){
    if(!mixer || !action || !clipLen) return false;
    state.playing = false; state.seek = null;
    action.paused = false;
    mixer.setTime(((t % clipLen) + clipLen) % clipLen);
    action.paused = true;
    controls.update();
    renderer.render(scene, camera);
    return true;
  },
  // 绕包围盒中心水平旋转视角（deg），用于给 GIF 补一点全貌
  spin(deg){
    if(!root || !box) return false;
    const c = new THREE.Vector3(), t = controls.target.clone();
    box.getCenter(c);
    const r = Math.hypot(camera.position.x - t.x, camera.position.z - t.z) || 1;
    const a = deg * Math.PI / 180;
    camera.position.x = t.x + Math.sin(a) * r;
    camera.position.z = t.z + Math.cos(a) * r;
    camera.lookAt(t);
    renderer.render(scene, camera);
    return true;
  },
  info(){ return { ready: this.ready, clipLen, parts: root?.userData.parts || 0,
                   bones: root?.userData.bones || 0 }; },
  // 世界包围盒：判断「画面黑」到底是相机没对准，还是动画把网格压成一点
  bbox(){
    if(!root) return null;
    const b = new THREE.Box3().setFromObject(root);
    if(!isFinite(b.min.x)) return { empty: true };
    return { min: b.min.toArray().map(v=>+v.toFixed(2)),
             max: b.max.toArray().map(v=>+v.toFixed(2)),
             size: b.getSize(new THREE.Vector3()).toArray().map(v=>+v.toFixed(2)) };
  }
};

// ---------- GIF 导出 ----------
// 导出模块只认这一层接口，不直接碰 three 的对象。
const gifCtx = {
  get clipLen(){ return clipLen; },
  get name(){ return state.title || `${MODELS[state.boss].name}_${state.phase}阶段`; },
  pose(t){
    if(!mixer || !action || !clipLen) return false;
    action.paused = false;                 // paused=true 会把 timeScale 归零，setTime 推不动
    mixer.setTime(((t % clipLen) + clipLen) % clipLen);
    action.paused = true;
    followTrack(t);
    return true;
  },
  setSize(px){
    renderer.setPixelRatio(1);
    renderer.setSize(px, px, false);
    camera.aspect = 1;
    camera.updateProjectionMatrix();
  },
  render(){ renderer.render(scene, camera); return renderer.domElement; },
  setDark(v){ state.dark = v; renderer.setClearColor(v ? 0x0e1116 : 0xffffff, 1); },
  begin(dark){
    this._snap = {
      pr: renderer.getPixelRatio(), aspect: camera.aspect,
      pos: camera.position.clone(), target: controls.target.clone(),
      auto: controls.autoRotate, dark: state.dark, wire: state.wire,
      playing: state.playing,
    };
    state.suspend = true;
    controls.autoRotate = false;
    if(state.wire && root) root.traverse(o=>{ if(o.isMesh && o.material) o.material.wireframe = false; });
    this.setDark(!!dark);
    renderer.render(scene, camera);
  },
  end(){
    const s = this._snap;
    this._snap = null;
    state.suspend = false;
    clock.getDelta();                      // 丢掉导出期间累积的 delta，避免恢复后动画跳
    if(!s) return;
    renderer.setPixelRatio(s.pr);
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = s.aspect;
    camera.updateProjectionMatrix();
    camera.position.copy(s.pos);
    controls.target.copy(s.target);
    controls.autoRotate = s.auto;
    state.autorot = s.auto;
    state.wire = s.wire;
    if(root) root.traverse(o=>{ if(o.isMesh && o.material) o.material.wireframe = s.wire; });
    this.setDark(s.dark);
    state.playing = s.playing;
    syncUI();
  },
};

// 给自动化/CDP 留一个不触发下载的入口
window.__nkas.exportGif = (o = {}) => exportGif(gifCtx, { ...o, download: false });

const gifModal = document.getElementById('gifModal');
const gifBtn   = document.getElementById('gifBtn');
const gifGo    = document.getElementById('gifGo');
const gifClose = document.getElementById('gifClose');
const gifBar   = document.getElementById('gifBar');
const gifMsg   = document.getElementById('gifMsg');
const gifCap   = document.getElementById('gifCap');

const gifOpt = { longEdge: 900, fps: 15, dark: true };
let gifAbort = null;

function updateGifHint(){
  gifCap.textContent = `当前：${gifCtx.name}`;
  if(!clipLen){
    gifMsg.textContent = '当前模型没有内置动画，无法导出';
    gifGo.disabled = true;
    return;
  }
  gifGo.disabled = false;
  const p = planFrames(clipLen, gifOpt.fps);
  gifMsg.innerHTML = `原动画 <b>${clipLen.toFixed(2)}s</b> → <b>${p.n}</b> 帧 × ${p.ms}ms `
    + `= <b>${(p.n * p.ms / 1000).toFixed(2)}s</b>（误差 ${(p.err * 100).toFixed(2)}%）`;
}

function segPick(box, cb){
  box.addEventListener('click', (e)=>{
    const b = e.target.closest('button');
    if(!b) return;
    [...box.children].forEach(x=>x.classList.toggle('on', x === b));
    cb(b.dataset.v);
    updateGifHint();
  });
}
segPick(document.getElementById('gifSize'), v=>{ gifOpt.longEdge = +v; });
segPick(document.getElementById('gifFps'),  v=>{ gifOpt.fps = +v; });
segPick(document.getElementById('gifBg'),   v=>{ gifOpt.dark = v === 'dark'; });

gifBtn.addEventListener('click', ()=>{
  gifMsg.style.color = '';
  gifBar.style.width = '0%';
  updateGifHint();
  gifModal.classList.add('on');
});

gifClose.addEventListener('click', ()=>{
  if(gifAbort){ gifAbort.abort(); return; }
  gifModal.classList.remove('on');
});

gifGo.addEventListener('click', async ()=>{
  if(gifAbort){ gifAbort.abort(); return; }      // 导出中：按钮变取消
  gifAbort = new AbortController();
  gifGo.textContent = '取消';
  gifGo.classList.remove('on');
  gifBar.style.width = '0%';
  gifMsg.style.color = '';
  try{
    const r = await exportGif(gifCtx, {
      longEdge: gifOpt.longEdge,
      fps: gifOpt.fps,
      dark: gifOpt.dark,
      signal: gifAbort.signal,
      onProgress: ({ phase, i, n, pct })=>{
        gifBar.style.width = pct.toFixed(1) + '%';
        const label = phase === 'measure' ? '测量构图'
                    : phase === 'palette' ? '生成调色板' : '渲染编码';
        gifMsg.textContent = `${label} ${i}/${n} · ${pct.toFixed(0)}%`;
      },
    });
    gifBar.style.width = '100%';
    gifMsg.innerHTML = `完成 <b>${r.width}×${r.height}</b> · ${r.frames} 帧 · `
      + `<b>${(r.bytes / 1048576).toFixed(2)} MB</b> · 用时 ${(r.elapsed / 1000).toFixed(1)}s<br>文件已开始下载`;
  }catch(err){
    gifBar.style.width = '0%';
    if(err.name === 'AbortError'){
      gifMsg.textContent = '已取消';
    }else{
      gifMsg.style.color = '#e0533d';
      gifMsg.textContent = '失败：' + err.message;
    }
  }finally{
    gifAbort = null;
    gifGo.textContent = '开始导出';
    gifGo.classList.add('on');
  }
});

const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt = clock.getDelta();
  if(state.suspend) return;          // 导出 GIF 期间由导出模块接管渲染
  if(mixer && state.playing) mixer.update(dt);
  controls.update();
  renderer.render(scene, camera);
}
tick();
load();
</script>
</body>
</html>
